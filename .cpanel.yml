---
deployment:
  tasks:
    # ================================================================== #
    #  ContentOS — cPanel Git Deployment                                  #
    #  User:       hindust1                                               #
    #  API Folder: /home/hindust1/api.hidustansocialnetwork.in/          #
    #  Frontend:   /home/hindust1/public_html/                           #
    # ================================================================== #

    # 1. Use Node.js 22
    - export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH

    # 2. Install prod + dev deps (dev needed for tsc)
    - npm ci --include=dev --ignore-scripts

    # 3. Build backend TypeScript → dist-api/
    - npx tsc -p server/tsconfig.json

    # 4. Remove devDeps to save disk space
    - npm prune --omit=dev

    # 5. Copy frontend build (dist/) → public_html/
    - /bin/cp -Rf dist/. /home/hindust1/public_html/

    # 6. Verify backend build
    - test -f dist-api/phase-main.js || (echo "ERROR: Backend build failed" && exit 1)

    # 7. Restart Node.js app (Passenger restart trigger)
    - /bin/mkdir -p /home/hindust1/api.hidustansocialnetwork.in/tmp
    - /bin/touch /home/hindust1/api.hidustansocialnetwork.in/tmp/restart.txt
