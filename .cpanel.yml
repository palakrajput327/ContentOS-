---
deployment:
  tasks:
    # ================================================================== #
    #  ContentOS — cPanel Git Deployment (Backend API only)              #
    #  Server User:  hindust1                                             #
    #  App Folder:   /home/hindust1/api.hidustansocialnetwork.in/        #
    #  API Domain:   https://api.hidustansocialnetwork.in                #
    #  Frontend:     Build locally → upload dist/ via FTP                #
    #                to /home/hindust1/hidustansocialnetwork.in/         #
    #  Trigger:      cPanel > Git Version Control > Deploy HEAD          #
    # ================================================================== #

    # 1. Use Node.js 22 (must match cPanel "Setup Node.js App" selection)
    - export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH

    # 2. Verify runtime versions (shown in deploy log)
    - node --version
    - npm --version

    # 3. Install all dependencies including devDeps (needed for tsc)
    #    --ignore-scripts prevents postinstall from double-building
    - npm ci --include=dev --ignore-scripts

    # 4. Compile TypeScript backend → dist-api/
    #    (Frontend is NOT built here — build locally and upload dist/)
    - npx tsc -p server/tsconfig.json

    # 5. Remove devDependencies after build to save disk space
    - npm prune --omit=dev

    # 6. Verify critical output files — deploy fails if these are missing
    - test -f dist-api/phase-main.js  || (echo "DEPLOY ERROR: dist-api/phase-main.js missing" && exit 1)
    - test -f dist-api/worker.js      || (echo "DEPLOY ERROR: dist-api/worker.js missing" && exit 1)
    - test -f dist-api/mail-worker.js || (echo "DEPLOY ERROR: dist-api/mail-worker.js missing" && exit 1)

    # ------------------------------------------------------------------ #
    # AFTER DEPLOY — Manual steps required in cPanel:                     #
    # 1. cPanel > Setup Node.js App > Restart the app                     #
    # 2. Make sure .env exists at:                                         #
    #    /home/hindust1/api.hidustansocialnetwork.in/.env                 #
    # 3. uploads/ and dist-api/ are preserved across deploys              #
    # ------------------------------------------------------------------ #
